name: newpc-runner
on: [push, pull_request]
jobs:
  backend-gate:
    name: backend-gate (newpc)
    runs-on: [self-hosted, newpc]
    steps:
      - uses: actions/checkout@v5
      - name: Install deps (system python3)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/requirements-ci.txt
      - name: Run ci_gate (syntax + flake8 + deterministic + offline tests)
        run: ./scripts/ci_gate.sh all
